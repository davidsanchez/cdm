version: '3.3'
services:
  dev-cdm:
    privileged: true
    hostname: dev-cdm
    container_name: "MOS-CDM-DEV"
    image: "cdm:dev"
    # restart: unless-stopped

    ports:
        - "48011:48011"
    ipc: host
    volumes:
      #- /home/shifter/Docker/cdm:/home/cdmmgr/cdm
      - /home/lstoperator/log/:/home/cdmmgr/log
      - /home/lst-drive/cdm/cdm/devicecontroller:/home/cdmmgr/devicecontroller
      - /home/lst-drive/cdm/cdm/cdmdevice:/home/cdmmgr/cdmdevice
      - /dev:/dev
      - /var/run:/var/run
      - /home/lstoperator/CDM/:/home/cdmmgr/output
