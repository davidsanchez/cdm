version: '3.3'
services:
  dev-cdm:
    privileged: true
    hostname: dev-cdm
    container_name: "MOS-CDM-DEV"
    image: "cdm:local"
    # restart: unless-stopped
    stdin_open: true 
    tty: true
    ports:
       - "48011:48011"
    ipc: host
    volumes:
      - /Users/david/CDM/newCode/log:/home/cdmmgr/log
      - /Users/david/CDM/newCode/cdm:/home/cdmmgr/cdm
      #- /dev:/dev
      #- /var/run:/var/run
      - /Users/david/CDM/newCode/cdm/output:/home/cdmmgr/output